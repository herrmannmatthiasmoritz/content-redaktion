# Themen des Redaktionslaufs. Je Eintrag startet ein Rechercheur.
# Übernommen aus den 5 bisherigen Scheduled Tasks (Stand 23.11.2026).
# Matthias pflegt diese Datei; der Scout macht nur Vorschläge.

# Zeitfenster je Fundtyp (seit 27.11.2026). Aktualität ist ein Plus, nicht der Maßstab:
# Meldungen nur frisch, Fallstudien/Studien/Widersprüche dürfen älter sein.
# Ein Thema kann einzelne Werte mit eigenem `zeitfenster:` überschreiben.
standard_zeitfenster:
  meldung: 7 Tage
  fallstudie: 12 Monate
  studie: 12 Monate
  widerspruch: 12 Monate
  patent: 90 Tage
  debatte: 30 Tage

# Parallelbetrieb mit den alten Recherche-Aufgaben (Phase 1). Solange true, hängt der
# Redaktionslauf an jeden Dateinamen " (Redaktion)" an, damit alte und neue Karten im
# Cockpit nebeneinander stehen. Auf false setzen, sobald die alten Aufgaben pausiert sind.
parallelbetrieb: true

themen:
  - id: ai-usecases-fertigung
    aktiv: true
    titel: AI Usecases in der Hardware/Fertigung
    dateiname: AI Usecases Hardware-Fertigung      # bisheriger Name, das Cockpit kennt ihn
    fokus: >-
      Konkrete AI-Anwendungen in Fertigung, Verfahrenstechnik, Werkstoffen,
      Prozessautomatisierung — mit Belegen, nicht Ankündigungen.

  - id: additive-industrialisierung
    aktiv: true
    titel: Technologie- und Marktentwicklungen in additiver Fertigung und Industrialisierung/Deployment-Scale-up
    dateiname: Additive Fertigung
    fokus: >-
      Weg vom Pilot zur Serie, Anlagen, Werkstoffe, Qualifizierung, Kostenkurven.
      Reine Quartalszahlen gehören zu Agent 01, nicht hierher.

  - id: ai-mittelstand
    aktiv: true
    titel: AI Trends im Mittelstand
    dateiname: AI Trends Mittelstand
    fokus: >-
      Studien, Umfragen, Fallbeispiele zur AI-Einführung im deutschen Mittelstand,
      besonders produzierendes Gewerbe.

  - id: ai-releases
    aktiv: true
    titel: AI-spezifische Releases, Ankündigungen und Produktnews (relevante Modelle, Tools, Plattformen)
    dateiname: AI Releases Produktnews
    fokus: >-
      Nur Releases mit erkennbarem Anwendungsnutzen für Praktiker; Benchmarks und
      Finanzierungsrunden ohne Anwendungsbezug weglassen (Tool-2-Scope).

  - id: ai-lernstoff
    aktiv: true
    art: lernstoff        # zeitlos statt Nachrichtenlage; Sonderregeln in rechercheur.md, redakteur.md, schreiber.md
    titel: AI verstehen — Zusammenhänge hinter LLMs und Agenten
    dateiname: AI verstehen
    zeitraum: zeitlos — ein aktueller Anlass aus den letzten 30 Tagen ist willkommen, aber keine Pflicht
    fokus: >-
      Keine Glossar-Einträge, sondern Zusammenhänge: je Woche EINE Leitfrage, die zeigt, wie
      zwei bis vier Bausteine (Modell, Harness, Tools, Kontext, Trace, Evals, Mensch)
      zusammenwirken und was daraus für den Betrieb folgt. Zwei Ziele: Matthias versteht das
      Thema selbst tiefer, und die Karte zahlt auf seine Positionierung ein
      (Pilot→Serie, Industrialisierung, AI-Adoption in der Fertigung). Einfache Sprache,
      eine tragende Analogie aus Fertigung oder Werkstatt, belegt aus Primärquellen.
    material: config/lernstoff/   # Matthias' Rohnotizen; der Rechercheur nutzt sie als Ausgangspunkt
    # Lernpfad: Die Fragen bauen aufeinander auf, deshalb in dieser Reihenfolge abarbeiten.
    # Erledigtes erkennt der Lauf an bereits_gesehen. Matthias pflegt diese Liste.
    lernpfad:
      - frage: Wer steuert eigentlich einen Agenten, das Modell oder der Harness drumherum?
        bausteine: [LLM, Agent Harness, Agentic Loop, Tools]
        positionierung: Der Prototyp ist das Modell, die Serie ist der Harness.
        material: 2026-11-25-eingang-matthias.md
      - frage: Woran erkennt man hinterher, warum ein Agent falsch lag?
        bausteine: [Trace, Spans, Harness, Tool-Calls]
        positionierung: Ohne Rückverfolgbarkeit keine Freigabe, wie bei jedem Serienbauteil.
        material: 2026-11-25-eingang-matthias.md
      - frage: Warum vergisst ein Agent mitten in der Aufgabe, was er wusste?
        bausteine: [Context Window, Context Engineering, RAG, Harness]
        positionierung: Information am Arbeitsplatz bereitstellen, nicht im Lager suchen lassen.
      - frage: Wie bekommt ein Agent Zugriff auf Maschinen und ERP, ohne dass es gefährlich wird?
        bausteine: [Tool Calling, MCP, Permissions, Human-in-the-Loop]
        positionierung: Schreibrechte sind eine Freigabefrage, keine Modellfrage.
      - frage: Wie prüft man einen Agenten, bevor er in Serie geht?
        bausteine: [Evals, Traces als Testdaten, Regression-Tests]
        positionierung: Erstmusterprüfung und Regressionstest für Software, die nicht deterministisch ist.
      - frage: Wann lohnt ein Agent und wann reicht ein fester Workflow?
        bausteine: [Workflow, Agent, Tokens und Kosten, Latenz]
        positionierung: Nicht jeder Prozess braucht Autonomie; Kosten pro Durchlauf entscheiden.
      - frage: Warum halluziniert ein Modell, und was fängt das System davon ab?
        bausteine: [LLM, RAG, Quellenverlinkung, Human-in-the-Loop]
        positionierung: Fehler im Einzelteil passieren; das System muss sie abfangen.
      - frage: Was ändert sich, wenn mehrere Agenten zusammenarbeiten?
        bausteine: [Sub-Agenten, Handoffs, Orchestrierung, Traces]
        positionierung: Arbeitsteilung wie in einer Fertigungslinie, mit denselben Schnittstellenproblemen.

  - id: wettbewerber-scaleups
    aktiv: false   # deaktiviert 23.11.2026 auf Wunsch von Matthias; zum Reaktivieren auf true setzen
    titel: Hardware-Scale-ups im Raum München (Finanzierung, Kündigungen, Führungswechsel, Produktlaunches)
    dateiname: Wettbewerber-News Hardware-Scale-ups
    fokus: >-
      Ursprünglich für die Jobsuche angelegt. Für LinkedIn nur verwertbar, wenn ein
      Industrialisierungs- oder AI-Winkel erkennbar ist.
    hinweis: >-
      Pausiert, nicht gelöscht. Die alte geplante Aufgabe "Recherche: Wettbewerber-News
      (Hardware-Scale-ups München)" ist ebenfalls nur deaktiviert.

  # --- neu 27.11.2026 ---

  # Beide Themen stehen bis zum 01.12.2026 auf `aktiv: false`. Grund: der `hinweis` unten
  # ist eine Auflage an die Agenten, wird aber von runs/redaktionslauf.md Schritt 3 nicht
  # mitgegeben und erreicht weder Rechercheur noch Redakteur. Solange das so ist, kann der
  # Redakteur fuer EOS-Anmeldungen genau den Winkel schreiben, den der hinweis verbietet.
  # Scharf schalten, sobald `hinweis` durchgereicht wird — siehe Protokoll des Laufs vom 30.11.


  - id: patente-am-ai
    aktiv: false
    titel: Patente zu additiver Fertigung und AI in der Fertigung
    dateiname: Patente AM und AI-Fertigung
    zeitfenster:
      patent: 90 Tage
    fokus: >-
      Patentanmeldungen und -erteilungen zu additiver Fertigung (Anlagen, Prozessregelung,
      Werkstoffe, Nachbearbeitung) und zu AI in der Fertigung (Prozessüberwachung,
      Qualitätsprüfung, Parameteroptimierung). Interessant sind Richtungen, nicht einzelne
      Nummern: Wer meldet plötzlich viel an, wo tauchen Nicht-AM-Firmen auf, welche Probleme
      wollen mehrere Anmelder gleichzeitig lösen. Quellen: Google Patents, Espacenet, DPMA,
      WIPO Patentscope, Patent-Fachmedien.
    hinweis: >-
      Anmeldungen von EOS selbst nur als Fakt aufnehmen, nie als Winkel für Matthias —
      er kommentiert keine Schutzrechte seines Arbeitgebers.

  - id: ai-fuehrung
    aktiv: false
    titel: Was AI-Verantwortliche gerade beschäftigt (Head of AI, CAIO, AI-PM, AI Initiative Lead)
    dateiname: AI-Fuehrung Themen
    fokus: >-
      Woran Menschen in AI-Führungsrollen heute arbeiten und worüber sie streiten:
      Use-Case-Priorisierung und ROI-Nachweis, vom Pilot in den Betrieb, Build vs. Buy,
      Agenten im Produktivbetrieb, Governance und EU AI Act in der Umsetzung, Datenbasis,
      Organisation und Rollenzuschnitt, Change und Befähigung. Industrie und Fertigung
      bevorzugt. Gute Quellen: Umfragen unter AI-Verantwortlichen, Interviews und Talks von
      CAIOs/Heads of AI, Fachartikel aus Praxis, auffällige Muster in Stellenanzeigen für
      solche Rollen. Keine Tool-Releases — die gehören zu ai-releases.
